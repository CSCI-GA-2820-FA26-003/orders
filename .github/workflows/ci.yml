name: CI Build

on:
  push:
    branches:
      - master
    paths-ignore:
      - "README.md"
      - ".vscode/**"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "README.md"
      - ".vscode/**"

jobs:
  build:
    runs-on: ubuntu-latest
    container: python:3.12-slim

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: pgs3cr3t
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URI: "postgresql+psycopg://postgres:pgs3cr3t@postgres:5432/testdb"

    steps:
      # git is needed so checkout makes a real clone (Codecov reads commit info
      # from it); curl and gnupg are needed by the Codecov uploader
      # Chromium and its matching driver run the browser acceptance tests.
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl gnupg ca-certificates chromium chromium-driver

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv install --system --dev

      - name: Lint with flake8
        run: |
          flake8 service tests features --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 service tests features --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Lint with pylint
        run: |
          pylint service tests --max-line-length=127
          # Behave registers its step decorators dynamically.
          pylint features --max-line-length=127 --disable=not-callable

      - name: Run unit tests with pytest
        run: pytest --pspec --cov=service --cov-fail-under=95 --cov-report=xml --disable-warnings
        env:
          RETRY_COUNT: 1

      - name: Run Selenium acceptance tests
        env:
          BASE_URL: http://127.0.0.1:8080
          WAIT_SECONDS: 10
        run: |
          gunicorn --bind 127.0.0.1:8080 --workers 1 wsgi:app > /tmp/orders-bdd.log 2>&1 &
          orders_bdd_pid=$!
          trap 'kill "$orders_bdd_pid" 2>/dev/null || true' EXIT
          if ! curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 "$BASE_URL/health"; then
            cat /tmp/orders-bdd.log
            exit 1
          fi
          behave

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true

  deploy:
    name: Local K3s deployment
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install K3d
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Create cluster
        run: make cluster

      - name: Build image
        run: make build

      - name: Push image
        run: make push

      - name: Deploy PostgreSQL and Orders
        run: make deploy

      - name: Verify ingress and PostgreSQL persistence
        run: make smoke-test

      - name: Show deployment diagnostics
        if: failure()
        run: |
          kubectl --context k3d-nyu-devops get pods,services,ingress,pvc -o wide
          kubectl --context k3d-nyu-devops get events --sort-by=.lastTimestamp
          kubectl --context k3d-nyu-devops logs deployment/orders --all-containers=true --tail=100 || true
          kubectl --context k3d-nyu-devops logs postgres-0 --tail=100 || true

      - name: Remove cluster
        if: always()
        run: make cluster-rm
