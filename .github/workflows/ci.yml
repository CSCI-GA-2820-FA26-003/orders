name: CI Build

on:
  push:
    branches:
      - master
    paths-ignore:
      - "README.md"
      - ".vscode/**"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "README.md"
      - ".vscode/**"

jobs:
  build:
    runs-on: ubuntu-latest
    container: python:3.12-slim

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: pgs3cr3t
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URI: "postgresql+psycopg://postgres:pgs3cr3t@postgres:5432/testdb"

    steps:
      # git is needed so checkout makes a real clone (Codecov reads commit info
      # from it); curl and gnupg are needed by the Codecov uploader
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl gnupg ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv install --system --dev

      - name: Lint with flake8
        run: |
          flake8 service tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 service tests --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Lint with pylint
        run: pylint service tests --max-line-length=127

      - name: Run unit tests with pytest
        run: pytest --pspec --cov=service --cov-fail-under=95 --cov-report=xml --disable-warnings
        env:
          RETRY_COUNT: 1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
