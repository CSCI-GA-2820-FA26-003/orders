name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URI: postgresql+psycopg://postgres:postgres@localhost:5432/testdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install pipenv
          pipenv sync --dev --system
      - name: Run flake8
        run: python -m flake8 service tests
      - name: Run pylint
        run: python -m pylint service tests
      - name: Run unit tests with coverage
        run: python -m pytest --cov=service --cov-report=term-missing --cov-report=xml --cov-fail-under=95
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  kubernetes:
    name: Kubernetes acceptance
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned k3d
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64 \
            --output /tmp/orders-k3d
          echo '06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0  /tmp/orders-k3d' | sha256sum --check
          sudo install -m 0755 /tmp/orders-k3d /usr/local/bin/k3d
      - name: Verify fresh cluster, API and PostgreSQL persistence
        run: bash scripts/verify-kubernetes.sh
      - name: Save Kubernetes acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-acceptance
          if-no-files-found: warn
          path: |
            .test-tmp/kubernetes/verification.log
            .test-tmp/kubernetes/resources.txt
            .test-tmp/kubernetes/available-replicas.txt
